<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>坐席绩效业绩排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&family=Oswald:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Sora:wght@600;700&family=Space+Grotesk:wght@600;700&family=Manrope:wght@600;700&family=Poppins:wght@600;700&family=Bebas+Neue&family=Playfair+Display:wght@700;900&family=ZCOOL+XiaoWei&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --bg:linear-gradient(160deg,#0b2545,#13315c);
  --bg-solid:#0e2a4d;
  --surface:#103257;
  --surface-2:#0c284a;
  --text:#eaf2ff;
  --muted:#9fb6d6;
  --border:rgba(255,255,255,.12);
  --accent:#2e9be6;
  --accent-2:#5ad1c4;
  --accent-soft:rgba(46,155,230,.18);
  --header-bg:linear-gradient(90deg,#0a3d62,#11598c);
  --header-text:#ffffff;
  --rank-1:#ffd24a;
  --rank-2:#d8e2ee;
  --rank-3:#e6a36b;
  --glow:rgba(46,155,230,.35);
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --font-display:'Oswald',sans-serif;
  --font-body:'Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--text);
  background:var(--bg) fixed;
  background-color:var(--bg-solid);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.app{
  max-width:1240px;
  margin:0 auto;
  padding:22px 20px 40px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
/* ===== Top bar ===== */
.topbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0;}
.brand-mark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:30px;
  letter-spacing:1px;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  padding:8px 14px;
  border-radius:12px;
  box-shadow:var(--shadow);
  line-height:1;
}
.brand-text h1{
  margin:0;
  font-family:var(--font-body);
  font-weight:700;
  font-size:clamp(18px,2.4vw,26px);
  letter-spacing:.5px;
}
.brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
.note{
  flex:1 1 320px;
  font-size:12.5px;
  color:var(--muted);
  background:var(--accent-soft);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  padding:8px 12px;
  border-radius:10px;
  line-height:1.45;
}
/* ===== Controls ===== */
.controls{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.tabs{display:flex;flex-wrap:wrap;gap:8px;}
.tab{
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  padding:9px 18px;
  border-radius:999px;
  cursor:pointer;
  transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
}
.tab:hover{transform:translateY(-1px);}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  border-color:transparent;
  box-shadow:0 6px 18px var(--glow);
}
.tools{display:flex;align-items:center;gap:10px;flex:1 1 auto;justify-content:flex-end;}
.search{position:relative;flex:0 1 280px;min-width:160px;}
.search input{
  width:100%;
  font-family:var(--font-body);
  font-size:14px;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:999px;
  padding:10px 16px 10px 38px;
  outline:none;
  transition:border .2s ease, box-shadow .2s ease;
}
.search input::placeholder{color:var(--muted);}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.search::before{
  content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.7;pointer-events:none;
}
.auto-btn{
  font-family:var(--font-body);
  font-size:13px;font-weight:600;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .2s ease,border .2s ease;
}
.auto-btn:hover{border-color:var(--accent);}
.auto-btn.off{color:var(--accent-2);}
/* ===== Board ===== */
.board{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.table-scroll{
  max-height:62vh;
  overflow:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--accent) transparent;
}
.table-scroll::-webkit-scrollbar{width:9px;height:9px;}
.table-scroll::-webkit-scrollbar-thumb{background:var(--accent);border-radius:9px;}
.table-scroll::-webkit-scrollbar-track{background:transparent;}
.lb{width:100%;border-collapse:collapse;font-size:14px;min-width:760px;}
.lb thead th{
  position:sticky;top:0;z-index:5;
  background:var(--header-bg);
  color:var(--header-text);
  font-weight:600;
  text-align:center;
  padding:14px 16px;
  font-size:13px;
  letter-spacing:.5px;
  white-space:nowrap;
  backdrop-filter:blur(4px);
}
.lb thead th:nth-child(1),
.lb thead th:nth-child(2),
.lb thead th:nth-child(3){text-align:center;}
.lb tbody td{
  padding:12px 16px;
  text-align:center;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  color:var(--text);
}
.lb tbody td:nth-child(1),
.lb tbody td:nth-child(2),
.lb tbody td:nth-child(3){text-align:center;}
.lb tbody tr:nth-child(even){background:var(--surface-2);}
.lb tbody tr:hover{background:var(--accent-soft);}
.c-seq{font-family:var(--font-display);font-weight:600;color:var(--muted);}
.name{font-weight:600;}
.team-tag{
  display:inline-block;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-2);
  border:1px solid var(--border);
}
.c-rank{font-family:var(--font-display);font-weight:700;font-size:16px;}
.bonus{
  font-family:var(--font-display);font-weight:700;font-size:15px;
  color:var(--accent-2);
}
/* top 3 */
.lb tbody tr.r1{background:linear-gradient(90deg,var(--accent-soft),transparent);}
.lb tbody tr.r1 .c-rank{color:var(--rank-1);}
.lb tbody tr.r2 .c-rank{color:var(--rank-2);}
.lb tbody tr.r3 .c-rank{color:var(--rank-3);}
.lb tbody tr.r1 .name::after,
.lb tbody tr.r2 .name::after,
.lb tbody tr.r3 .name::after{
  content:"TOP";font-family:var(--font-display);font-size:9px;font-weight:700;
  margin-left:8px;padding:2px 6px;border-radius:6px;vertical-align:middle;
  background:var(--rank-1);color:#1a1300;letter-spacing:1px;
}
.lb tbody tr.r2 .name::after{background:var(--rank-2);color:#1a2230;}
.lb tbody tr.r3 .name::after{background:var(--rank-3);color:#1a1206;}
.scroll-hint{
  text-align:center;font-size:12px;color:var(--muted);
  padding:8px;background:var(--surface-2);border-top:1px solid var(--border);
}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-top:4px;}
.empty{padding:40px;text-align:center;color:var(--muted);}
/* ===== Floating theme ball ===== */
.theme-ball{
  position:fixed;right:18px;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border-radius:50%;
  border:none;cursor:pointer;z-index:60;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:22px;
  box-shadow:0 8px 24px var(--glow);
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s ease, box-shadow .25s ease;
}
.theme-ball:hover{transform:translateY(-50%) scale(1.08);}
.theme-ball.open{transform:translateY(-50%) rotate(45deg);}
.theme-panel{
  position:fixed;right:82px;top:50%;transform:translateY(-50%) translateX(20px);
  width:300px;max-height:78vh;overflow:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  z-index:59;
  padding:14px;
  opacity:0;visibility:hidden;
  transition:opacity .25s ease, transform .25s ease, visibility .25s;
}
.theme-panel.show{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0);}
.theme-panel-head{
  display:flex;align-items:center;justify-content:space-between;
  font-weight:700;font-size:14px;margin-bottom:10px;color:var(--text);
}
.theme-panel-head span{cursor:pointer;font-size:20px;line-height:1;color:var(--muted);}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.swatch{
  border:1px solid var(--border);border-radius:10px;overflow:hidden;
  cursor:pointer;background:var(--surface-2);transition:transform .15s ease,border .15s ease;
}
.swatch:hover{transform:translateY(-2px);}
.swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.swatch .preview{height:42px;display:flex;}
.swatch .preview i{flex:1;}
.swatch .label{font-size:11.5px;padding:5px 8px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* ===== Responsive ===== */
@media (max-width:760px){
  .app{padding:16px 12px 30px;gap:12px;}
  .brand-mark{font-size:22px;padding:6px 10px;border-radius:10px;}
  .note{flex:1 1 100%;order:3;}
  .controls{flex-direction:column;align-items:stretch;}
  .tabs{justify-content:center;}
  .tools{justify-content:space-between;}
  .search{flex:1 1 auto;}
  .table-scroll{max-height:64vh;}
  .lb{font-size:13px;min-width:680px;}
  .lb thead th,.lb tbody td{padding:11px 10px;}
  .theme-ball{width:46px;height:46px;font-size:19px;right:12px;}
  .theme-panel{width:auto;left:12px;right:12px;}
  /* sticky first column on small screens */
  .lb th:first-child,.lb td:first-child{position:sticky;left:0;z-index:3;background:var(--surface);}
  .lb tbody tr:nth-child(even) td:first-child{background:var(--surface-2);}
  .lb thead th:first-child{position:sticky;top:0;left:0;z-index:6;}
}
@media (max-width:430px){
  .tab{padding:8px 13px;font-size:13px;}
  .lb{font-size:12.5px;}
}
@media (prefers-reduced-motion:reduce){
  .theme-ball,.tab,.swatch{transition:none;}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>

/* ===== 状态 ===== */
const TABS = ['all','综合','人社','公教企','工单'];
let currentTab = 'all';
let query = '';
let autoMode = true;
let autoIndex = 0;
let paused = false;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== 工具：数字千分位 ===== */
function fmt(n){ return n.toLocaleString('zh-CN'); }

/* ===== 渲染榜单 ===== */
const tbody = document.getElementById('tbody');
const scroll = document.getElementById('scroll');

function getFiltered(){
  let list = DATA.filter(d => currentTab==='all' || d.team===currentTab);
  if(query){
    const q = query.toLowerCase();
    list = list.filter(d => d.name.toLowerCase().includes(q));
  }
  list.sort((a,b)=> b.bonusNum - a.bonusNum || b.award - a.award || b.report - a.report);
  return list;
}

function render(resetTop){
  const list = getFiltered();
  if(list.length === 0){
    tbody.innerHTML = '<tr><td colspan="8" class="empty">未找到匹配「'+ (query||'') +'」的人员</td></tr>';
    return;
  }
  const rows = list.map((d,i)=>{
    const rank = i+1;
    const rc = rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
    return '<tr class="'+rc+'">'
      + '<td class="c-seq">'+d.seq+'</td>'
      + '<td class="name">'+d.name+'</td>'
      + '<td><span class="team-tag">'+d.team+'</span></td>'
      + '<td>'+fmt(d.report)+'</td>'
      + '<td>'+fmt(d.missed)+'</td>'
      + '<td>'+fmt(d.award)+'</td>'
      + '<td class="c-rank">'+rank+'</td>'
      + '<td class="bonus">¥'+d.bonusStr+'</td>'
      + '</tr>';
  }).join('');
  tbody.innerHTML = rows;
  if(resetTop !== false) scroll.scrollTop = 0; // 轮播切换时保留滚动位置，滚动更连贯
}

/* ===== 切换器 / 搜索 ===== */
const tabsEl = document.getElementById('tabs');
tabsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  setActiveTab();
  autoMode = false;          // 手动选择后停止轮播
  updateAutoBtn();
  render(true);
});

function setActiveTab(){
  [...tabsEl.querySelectorAll('.tab')].forEach(t=>{
    t.classList.toggle('active', t.dataset.tab===currentTab);
  });
  autoIndex = Math.max(0, TABS.indexOf(currentTab));
}

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', e=>{
  query = e.target.value.trim();
  autoMode = false;
  updateAutoBtn();
  render(true);
});

/* ===== 自动轮播（顺序：全部→综合→人社→公教企→工单） ===== */
const autoBtn = document.getElementById('autoBtn');
function updateAutoBtn(){
  if(autoMode){
    autoBtn.textContent = '⏸ 暂停轮播';
    autoBtn.classList.remove('off');
    autoBtn.setAttribute('aria-pressed','true');
  }else{
    autoBtn.textContent = '▶ 自动轮播';
    autoBtn.classList.add('off');
    autoBtn.setAttribute('aria-pressed','false');
  }
}
autoBtn.addEventListener('click', ()=>{
  autoMode = !autoMode;
  if(autoMode){
    autoIndex = TABS.indexOf(currentTab);
    if(autoIndex<0) autoIndex = 0;
  }
  updateAutoBtn();
});

setInterval(()=>{
  if(!autoMode) return;
  autoIndex = (autoIndex+1) % TABS.length;
  currentTab = TABS[autoIndex];
  setActiveTab();
  render(false);   // 轮播切换不重置滚动位置
}, 9000);

/* ===== 缓慢滚动 ===== */
scroll.addEventListener('mouseenter', ()=> paused = true);
scroll.addEventListener('mouseleave', ()=> paused = false);
scroll.addEventListener('focusin', ()=> paused = true);
scroll.addEventListener('focusout', ()=> paused = false);

/* 用 setInterval 驱动（而非 requestAnimationFrame）：
   rAF 在 iframe/后台/某些预览环境里会被浏览器节流到近乎不触发，导致“不滚动”。
   setInterval 在可见页面中稳定运行，配合整数累加器即可平滑缓慢滚动。 */
const TICK = 33;          // 每 ~33ms 一步（≈30 步/秒）
const SPEED = 1.0;        // px / step ≈ 30px/s，缓慢
let dir = 1;              // 1 = 向下滚动(scrollTop 增大)，-1 = 向上滚动(scrollTop 减小)，上下往返
let acc = 0;              // 整数累加器：scrollTop 会被浏览器取整，需累积到 ≥1px 才真正移动
let scrollOn = true;      // 用户可显式暂停/继续自动滚动
const scrollBtn = document.getElementById('scrollBtn');
function updateScrollBtn(){
  scrollBtn.textContent = scrollOn ? '⏸ 暂停滚动' : '▶ 继续滚动';
  scrollBtn.setAttribute('aria-pressed', scrollOn ? 'true' : 'false');
}
scrollBtn.addEventListener('click', ()=>{ scrollOn = !scrollOn; updateScrollBtn(); });
updateScrollBtn();
function tick(){
  if(paused || !scrollOn) return;
  if(scroll.scrollHeight <= scroll.clientHeight + 4) return; // 内容未溢出，无需滚动
  const maxTop = scroll.scrollHeight - scroll.clientHeight;
  acc += SPEED * dir;                 // 累积小数位移
  if(Math.abs(acc) >= 1){             // 凑满 1px 才真正移动（避免被 scrollTop 取整吞掉）
    scroll.scrollTop += Math.trunc(acc);
    acc -= Math.trunc(acc);
  }
  if(scroll.scrollTop >= maxTop){     // 触底 → 反向向上
    scroll.scrollTop = maxTop; dir = -1; acc = 0;
  } else if(scroll.scrollTop <= 0){   // 触顶 → 反向向下
    scroll.scrollTop = 0; dir = 1; acc = 0;
  }
}
setInterval(tick, TICK); // 常驻自动滚动（鼠标悬停或点按钮可暂停）

/* ===== 主题选择器 ===== */
const root = document.documentElement;
function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  for(const [k,v] of Object.entries(t.vars)) root.style.setProperty(k,v);
  root.style.setProperty('--font-display', t.display);
  root.style.setProperty('--font-body', t.body);
  document.body.dataset.theme = t.id;
  try{ localStorage.setItem('lb-theme', t.id); }catch(e){}
  [...document.querySelectorAll('.swatch')].forEach(s=>{
    s.classList.toggle('active', s.dataset.id===t.id);
  });
}

const grid = document.getElementById('themeGrid');
THEMES.forEach(t=>{
  const el = document.createElement('div');
  el.className = 'swatch';
  el.dataset.id = t.id;
  el.title = t.name;
  const c = t.vars;
  el.innerHTML = '<div class="preview">'
    + '<i style="background:'+c['--bg-solid']+'"></i>'
    + '<i style="background:'+c['--accent']+'"></i>'
    + '<i style="background:'+c['--accent-2']+'"></i>'
    + '<i style="background:'+c['--rank-1']+'"></i>'
    + '</div><div class="label">'+t.name+'</div>';
  el.addEventListener('click', ()=> applyTheme(t.id));
  grid.appendChild(el);
});

const ball = document.getElementById('themeBall');
const panel = document.getElementById('themePanel');
const themeClose = document.getElementById('themeClose');
function togglePanel(force){
  const show = force !== undefined ? force : !panel.classList.contains('show');
  panel.classList.toggle('show', show);
  ball.classList.toggle('open', show);
  panel.setAttribute('aria-hidden', show ? 'false':'true');
  ball.setAttribute('aria-expanded', show ? 'true':'false');
}
ball.addEventListener('click', ()=> togglePanel());
themeClose.addEventListener('click', ()=> togglePanel(false));

/* ===== 初始化 ===== */
let saved = null;
try{ saved = localStorage.getItem('lb-theme'); }catch(e){}
applyTheme(saved && THEMES.some(t=>t.id===saved) ? saved : 'gov-blue');
updateAutoBtn();
render(true);
</script>
